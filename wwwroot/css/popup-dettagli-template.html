<!--
========================================
TEMPLATE POPUP DETTAGLI - DOCUMENTAZIONE
========================================

FILE CSS: popup-dettagli.css
Grafica elegante per popup trascinabili con header blu, griglia responsive e animazioni

CARATTERISTICHE:
- Popup trascinabile
- Header blu con gradiente
- Griglia responsive a 5 colonne
- Input modificabili con validazione visiva
- Pulsanti con hover/active states
- Alert box con animazioni
- Z-index alto (100000) per stare sopra a tutto

COME USARE:
1. Includi il file CSS nel tuo layout o nella pagina:
   <link rel="stylesheet" href="~/css/popup-dettagli.css" />

2. Copia la struttura HTML qui sotto
3. Adatta l'id del popup (es: popup-dettagli --> myCustomPopup)
4. Implementa le funzioni JavaScript (showPopup, closePopup, makeDraggable)
-->

<!-- ==================== STRUTTURA HTML POPUP ==================== -->

<!-- Popup Container -->
<div id="myPopup" class="popup-dettagli">
    
    <!-- Header con titolo e pulsante chiusura -->
    <div class="popup-header" id="myPopupHeader">
        <h5>
            <i class="bi bi-clipboard-data me-2"></i>
            Titolo Popup
        </h5>
        <button class="popup-close" onclick="closeMyPopup()">&times;</button>
    </div>
    
    <!-- Body con contenuto -->
    <div class="popup-body" id="myPopupBody">
        
        <!-- Griglia informazioni a 5 colonne -->
        <div class="info-grid">
            
            <!-- Campo normale (1 colonna) -->
            <div class="info-item">
                <div class="info-label">Campo 1</div>
                <div class="info-value">Valore campo</div>
            </div>
            
            <!-- Campo span 2 colonne -->
            <div class="info-item span-2">
                <div class="info-label">Campo Largo</div>
                <div class="info-value highlight">Valore importante</div>
            </div>
            
            <!-- Campo input modificabile -->
            <div class="info-item">
                <div class="info-label">Campo Modificabile</div>
                <input type="text" class="info-input" value="Editabile" />
            </div>
            
            <!-- Campo calcolato (verde) -->
            <div class="info-item">
                <div class="info-label">Valore Calcolato</div>
                <div class="info-value calculated" id="calcolato">123.45</div>
            </div>
            
            <!-- Campo full-width -->
            <div class="info-item full-width">
                <div class="info-label">Note</div>
                <div class="info-value">Testo lungo che occupa tutta la larghezza</div>
            </div>
            
        </div>
        
        <!-- Alert box (opzionale) -->
        <div class="alert-fermo-centro" id="myAlert">
            <strong>⚠️ Attenzione:</strong> Messaggio di avviso
        </div>
        
    </div>
    
    <!-- Footer con pulsanti (opzionale) -->
    <div class="popup-footer" id="myPopupFooter">
        <button type="button" class="btn-save-changes" onclick="saveChanges()">
            <i class="bi bi-check-circle me-2"></i>
            Salva Modifiche
        </button>
    </div>
    
</div>

<!-- ==================== JAVASCRIPT NECESSARIO ==================== -->

<script>
    // Mostra popup
    function showMyPopup(data) {
        const popup = document.getElementById('myPopup');
        const body = document.getElementById('myPopupBody');
        
        // Popola il body con i dati (esempio)
        // body.innerHTML = ...
        
        // Mostra popup centrato
        popup.style.display = 'block';
        popup.style.left = '50%';
        popup.style.top = '10%';
        popup.style.transform = 'translateX(-50%)';
    }
    
    // Chiudi popup
    function closeMyPopup() {
        document.getElementById('myPopup').style.display = 'none';
    }
    
    // Rendi popup trascinabile (chiamare dopo DOMContentLoaded)
    function makeDraggable(element, header) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        header.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            element.classList.add('dragging');
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            element.style.top = (element.offsetTop - pos2) + 'px';
            element.style.left = (element.offsetLeft - pos1) + 'px';
            element.style.transform = 'none';
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            element.classList.remove('dragging');
        }
    }
    
    // Inizializza al caricamento pagina
    document.addEventListener('DOMContentLoaded', function() {
        makeDraggable(
            document.getElementById('myPopup'), 
            document.getElementById('myPopupHeader')
        );
    });
</script>
